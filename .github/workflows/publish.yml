name: Publish

# roda quando envio uma tag de versão (npm version + git push --follow-tags)
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # para o trusted publishing do npm

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Conferir se a tag bate com a versão do package.json
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME diferente da versão do package.json ($PKG_VERSION)"
            exit 1
          fi

      - run: npm ci
      - run: npx biome ci .
      - run: npm publish
