name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Lint e testes (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # Falha se houver erro de lint ou código fora da formatação (não altera arquivos)
      - run: npx biome ci .

      # Compila e roda os testes unitários
      - run: npm test
